<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white" opacity="0.06"/>
    </pattern>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#leftFade)"/>
  <rect width="1200" height="630" fill="url(#rightFade)"/>

  <!-- Yellow accent line -->
  <rect x="80" y="160" width="48" height="4" rx="2" fill="#fde047"/>

  <!-- Name -->
  <text x="80" y="280" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">이두현</text>

  <!-- Role -->
  <text x="80" y="345" font-family="'Inter', 'Arial', sans-serif" font-size="32" font-weight="400" fill="#9ca3af" letter-spacing="0.5">Full-Stack Developer</text>

  <!-- Tagline -->
  <text x="80" y="420" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="400" fill="#6b7280">문제를 먼저 정의하는 개발자</text>

  <!-- Tech stack pills -->
  <rect x="80" y="465" width="96" height="28" rx="14" fill="white" fill-opacity="0.08"/>
  <text x="128" y="484" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#d1d5db" text-anchor="middle">Vue / Nuxt</text>

  <rect x="186" y="465" width="120" height="28" rx="14" fill="white" fill-opacity="0.08"/>
  <text x="246" y="484" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#d1d5db" text-anchor="middle">Spring Boot</text>

  <rect x="316" y="465" width="100" height="28" rx="14" fill="white" fill-opacity="0.08"/>
  <text x="366" y="484" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#d1d5db" text-anchor="middle">TypeScript</text>

  <rect x="426" y="465" width="96" height="28" rx="14" fill="white" fill-opacity="0.08"/>
  <text x="474" y="484" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#d1d5db" text-anchor="middle">AI Pipeline</text>

  <!-- Right side accent -->
  <circle cx="1000" cy="315" r="180" fill="#fde047" fill-opacity="0.03"/>
  <circle cx="1000" cy="315" r="120" fill="#fde047" fill-opacity="0.04"/>
  <circle cx="1000" cy="315" r="60" fill="#fde047" fill-opacity="0.06"/>

  <!-- Stats -->
  <text x="940" y="260" font-family="'Inter', sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">3+</text>
  <text x="940" y="290" font-family="'Noto Sans KR', sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Years Experience</text>

  <text x="1060" y="340" font-family="'Inter', sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">6+</text>
  <text x="1060" y="370" font-family="'Noto Sans KR', sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Projects</text>

  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="#fde047" opacity="0.6"/>
</svg>
